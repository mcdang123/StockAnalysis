name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - stock_fetcher_service
          - stock_analysis_service
          - stock_pattern_service
          - stock_api_gateway

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: root
      DB_PASSWORD: changeme
      FINNHUB_API_KEY: dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build and test
        working-directory: ${{ matrix.module }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify
